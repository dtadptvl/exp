name: OneDrive-GDrive migration CI

on:
  push:
    branches:
      - feat/onedrive-gdrive-colab-migration
  pull_request:
    paths:
      - 'migration/**'
      - 'tests/test_migration_assets.py'
      - '.github/workflows/onedrive-gdrive-migration-ci.yml'
      - '.gitignore'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate migration assets
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          foreach ($file in @(
            './migration/setup-auth.ps1',
            './migration/update-google-client.ps1',
            './migration/home-server-migrate.ps1'
          )) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$null,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
      - name: Parse Bash script
        run: bash -n migration/home-server-migrate.sh
      - name: Build home-server bundle
        run: |
          mkdir -p .dist
          cp migration/setup-auth.ps1 migration/update-google-client.ps1 migration/home-server-migrate.ps1 migration/home-server-migrate.sh migration/README.md .dist/
          cd .dist && zip -9 ../onedrive-gdrive-home-server.zip ./*
      - uses: actions/upload-artifact@v4
        with:
          name: onedrive-gdrive-home-server
          path: onedrive-gdrive-home-server.zip
