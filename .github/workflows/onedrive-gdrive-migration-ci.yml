name: OneDrive-GDrive migration CI

on:
  push:
    branches:
      - feat/onedrive-gdrive-colab-migration
  pull_request:
    paths:
      - 'migration/**'
      - 'tests/test_migration_assets.py'
      - '.github/workflows/onedrive-gdrive-migration-ci.yml'
      - '.gitignore'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate migration assets
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Parse PowerShell script
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './migration/setup-auth.ps1'),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Build distributable bundle
        run: |
          mkdir -p .dist
          cp migration/setup-auth.ps1 migration/colab-migrate.ipynb migration/colab-check-resume.ipynb migration/README.md .dist/
          cd .dist && zip -9 ../onedrive-gdrive-migration.zip ./*
      - uses: actions/upload-artifact@v4
        with:
          name: onedrive-gdrive-migration
          path: onedrive-gdrive-migration.zip
