name: 9Router Keeper Windows

on:
  push:
    branches:
      - test/9router-keeper
  workflow_dispatch:

jobs:
  windows-integration:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify artifact hash
        shell: powershell
        run: |
          $expected = "17ce09f3716c1bf6e3325b366de630c5296106ee564208e7bd14c7bb15aae77a"
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath "artifacts/9RouterKeeper-v1.1.zip").Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "SHA256 mismatch: $actual" }

      - name: Expand artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path keeper -Force | Out-Null
          Expand-Archive -LiteralPath "artifacts/9RouterKeeper-v1.1.zip" -DestinationPath keeper -Force

      - name: Run Windows integration checks
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "keeper/tests/integration.ps1"

      - name: Upload tested artifact
        uses: actions/upload-artifact@v4
        with:
          name: 9RouterKeeper-v1.1-tested
          path: artifacts/9RouterKeeper-v1.1.zip
