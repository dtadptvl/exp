name: 9Router Keeper Windows

on:
  push:
    branches:
      - test/9router-keeper
  workflow_dispatch:

jobs:
  windows-integration:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild exact artifact from Base64
        shell: powershell
        run: |
          $b64 = (Get-Content -LiteralPath "artifacts/9RouterKeeper-v1.1.zip.b64" -Raw).Trim()
          [IO.File]::WriteAllBytes("9RouterKeeper-v1.1.zip", [Convert]::FromBase64String($b64))
          $expected = "d702398609c04ee59073ff69ebe303a729a9688281f3da4ab789d7211ca7126a"
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath "9RouterKeeper-v1.1.zip").Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "SHA256 mismatch: $actual" }

      - name: Expand artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path keeper -Force | Out-Null
          Expand-Archive -LiteralPath "9RouterKeeper-v1.1.zip" -DestinationPath keeper -Force

      - name: Run Windows integration checks
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "keeper/tests/integration.ps1"

      - name: Upload tested artifact
        uses: actions/upload-artifact@v4
        with:
          name: 9RouterKeeper-v1.1-tested
          path: 9RouterKeeper-v1.1.zip
